<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relógio">
<meta name="theme-color" content="#26282d">
<title>Relógio</title>
<link rel="apple-touch-icon" href="icone-assistente.png">
<link rel="icon" href="icone-assistente.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: #26282d; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; overflow: hidden; }
  button { font-family: inherit; }
  .app { max-width: 420px; margin: 0 auto; height: 100%; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 12px); }

  .top { display: flex; justify-content: center; padding-bottom: 14px; flex-shrink: 0; }
  .pill { display: flex; align-items: center; gap: 8px; border-radius: 20px; height: 38px; padding: 0 16px; font-size: 15px; font-weight: 500; line-height: 1;
    border: 1.5px solid #A32D2D; color: #E24B4A; }
  .pill svg { width: 20px; height: 20px; display: block; }
  .pill.green  { border-color: #1D9E75; color: #5DCAA5; }
  .pill.yellow { border-color: #BA7517; color: #EF9F27; }
  .pill.red    { border-color: #A32D2D; color: #E24B4A; }
  .pill.wait svg { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .visor { border: 1.5px solid #5DCAA5; border-radius: 20px; height: clamp(72px, 13vh, 104px); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 50px; font-weight: 500; margin-bottom: 14px; letter-spacing: 2px; transition: border-color .2s, background .2s; font-variant-numeric: tabular-nums; color: #5DCAA5; }
  .visor .dim { color: #444441; }
  .colon { color: #fff; margin: 0 4px; position: relative; top: -4px; }
  .visor.ok  { border-color: #97C459; background: #1d3a2c; }
  .visor.bad { border-color: #E24B4A; background: #3a1f1f; }

  .keys { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 11px; flex: 1 1 auto; min-height: 220px; max-height: 440px; }
  .k { border: 1.5px solid #5DCAA5; border-radius: 18px; background: #33363c; color: #fff; font-size: 30px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; padding: 0; min-height: 44px; }
  .k:active { background: #444850; }
  .k svg { width: 30px; height: 30px; }
  .send { background: #1D9E75; }
  .send:active { background: #0F6E56; }

  .dg { background: #1c1d21; border-radius: 18px; text-align: center; margin-top: 14px; flex-shrink: 0; height: clamp(84px, 14vh, 118px);
    display: flex; align-items: center; justify-content: center; font-size: clamp(54px, 17vw, 76px); font-weight: 500; font-variant-numeric: tabular-nums; color: #444441; }
  .dg small { font-size: .36em; margin-left: 6px; align-self: flex-end; margin-bottom: .55em; }
  .dg.on { color: #fff; }
  .dg.got { color: #EF9F27; }
  .ver { text-align: right; font-size: 12px; color: #888780; padding-top: 4px; flex-shrink: 0; }

  .nolink { position: fixed; inset: 0; background: #26282d; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px; text-align: center; color: #D3D1C7; font-size: 17px; }
  .nolink.show { display: flex; }
  .turn { position: fixed; inset: 0; background: #26282d; z-index: 50; display: none; align-items: center; justify-content: center; color: #D3D1C7; font-size: 18px; }
  @media (orientation: landscape) and (max-height: 520px) { .turn { display: flex; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill" id="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19v-3M9.5 19v-6M14 19v-9M18.5 19V7"/></svg>
      <span id="pillTxt">Sem sinal</span>
    </div>
  </div>

  <div id="visor" class="visor"></div>

  <div class="keys">
    <button class="k" data-n="1">1</button><button class="k" data-n="2">2</button><button class="k" data-n="3">3</button>
    <button class="k" data-n="4">4</button><button class="k" data-n="5">5</button><button class="k" data-n="6">6</button>
    <button class="k" data-n="7">7</button><button class="k" data-n="8">8</button><button class="k" data-n="9">9</button>
    <button class="k" id="clr" aria-label="Apagar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="k" data-n="0">0</button>
    <button class="k send" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14L21 3"/><path d="M21 3l-6.5 18a.55 .55 0 0 1-1 0L10 14l-7-3.5a.55 .55 0 0 1 0-1L21 3"/></svg>
    </button>
  </div>

  <div class="dg" id="dg">--:--</div>
  <div class="ver">v2.2.4</div>
</div>

<div class="nolink" id="nolink">Abra este app pelo link que o mágico mandou.</div>
<div class="turn">Vire o celular de pé</div>

<script>
const ABLY_KEY = '-WkBxA.FUModg:DGe6U1wyeEuOu4_3iuubjnS144Ol3ojOlTb9mmqgmv0';
const ABLY_JS = ['ably.min.js', 'https://cdn.jsdelivr.net/npm/@ably/pubsub-device@3/dist/cdn/ably.min.js'];   // SDK novo do Ably (para aparelhos)
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('assist_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('assist_' + k, JSON.stringify(v)); } catch (e) {} }
};

// canal secreto: vem no link (#...) e fica guardado
let canal = (location.hash || '').replace('#', '').trim();
if (/^[a-z0-9]{10,}$/i.test(canal)) store.set('canal', canal); else canal = store.get('canal');

// ===== visor e teclado =====
let digits = '';
function renderVisor() {
  const show = i => i < digits.length ? digits[i] : '<span class="dim">0</span>';
  $('visor').innerHTML = show(0) + show(1) + '<span class="colon">:</span>' + show(2) + show(3);
}
function flash(cls) {
  const v = $('visor'); v.classList.remove('ok', 'bad'); void v.offsetWidth; v.classList.add(cls);
  setTimeout(() => v.classList.remove(cls), 900);
}
document.querySelectorAll('.k[data-n]').forEach(k => k.addEventListener('click', () => {
  if (digits.length >= 4) return;
  digits += k.dataset.n;
  if (digits.length === 2 && +digits > 23) { digits = ''; flash('bad'); }
  else if (digits.length === 4 && +digits.slice(2) > 59) { digits = digits.slice(0, 2); flash('bad'); }
  renderVisor();
}));
$('clr').addEventListener('click', () => { digits = ''; renderVisor(); });

// ===== aviso de cima: Conectado / Sem sinal =====
let online = false, linked = false;
function showPill() {
  const ok = online && linked;
  $('pill').className = 'pill' + (ok ? ' green' : '');
  $('pillTxt').textContent = ok ? 'Conectado' : 'Sem sinal';
  if (!ok) setWatch(null, 0);
}

// ===== caixa do relógio do mágico =====
// wt = segundos do dia que o relógio marca; y = segundos de Tempo de Segurança que faltam (laranja, parado)
let wBase = null, wAt = 0, wSafe = 0, gotAt = 0;
function setWatch(wt, y, got) {
  if (wt == null) { wBase = null; drawWatch(); return; }
  wBase = wt; wAt = Date.now(); wSafe = y || 0;
  if (got) gotAt = Date.now();
  drawWatch();
}
function drawWatch() {
  const box = $('dg');
  if (wBase == null) { box.className = 'dg'; box.textContent = '--:--'; return; }
  const el = Math.floor((Date.now() - wAt) / 1000);
  const t = el < wSafe ? wBase : (wBase + el - wSafe) % 86400;
  const orange = el < wSafe || Date.now() - gotAt < 3000;   // laranja: Tempo de Segurança (ou 3 s logo após receber)
  box.className = 'dg ' + (orange ? 'got' : 'on');
  box.innerHTML = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + '<small>' + pad(t % 60) + '</small>';
}
setInterval(drawWatch, 250);

// lastSeen: último sinal de vida do app do mágico (o "batimento" chega a cada 10 s)
let lastSeen = 0, lostAt = 0;
function fromPresence(d, ts) {
  ts = ts || Date.now();
  if (ts < lostAt) return;                 // sinal antigo, de antes de perder o contato
  lastSeen = Math.max(lastSeen, ts);
  if (Date.now() - lastSeen > 25000) { linked = false; showPill(); return; }
  d = d || {};
  linked = true; showPill();
  setWatch(d.bt ? d.wt : null, d.y);
}
function lose() { lostAt = Date.now(); linked = false; showPill(); }
setInterval(() => { if (linked && Date.now() - lastSeen > 25000) lose(); }, 2000);   // sem batimento há 25 s = sem sinal

// ===== Ably =====
let ably = null, ch = null, pending = null;
function loadScript(src) {
  return new Promise(res => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => res(!!window.AblyPubSub);
    s.onerror = () => { s.remove(); res(false); };
    document.head.appendChild(s);
  });
}
async function loadAbly() {
  if (window.AblyPubSub) return true;
  for (const src of ABLY_JS) if (await loadScript(src)) return true;
  return false;
}
async function refreshPresence() {
  if (!ch) return;
  try {
    const members = await ch.presence.get();
    const m = members.find(x => x.clientId === 'magico');
    if (m) fromPresence(m.data, m.timestamp); else { linked = false; showPill(); }
    diag(m ? '' : 'Ably ok — app do mágico não está presente');
  } catch (e) { diag('Ably presença: ' + errTxt(e)); }
}
function diag(t) { const d = document.getElementById('diag'); if (d) d.textContent = t; }
function errTxt(e) { if (!e) return ''; return (e.code ? e.code + ' ' : '') + (e.message || String(e)).slice(0, 140); }
async function start() {
  diag('Ably: carregando...');
  if (!(await loadAbly())) { diag('Ably: não carregou o arquivo ably.min.js'); setTimeout(start, 8000); return; }
  diag('Ably: conectando...');
  try {
  ably = AblyPubSub.createClient({ key: ABLY_KEY, clientId: 'assist-' + Math.random().toString(36).slice(2, 8), echoMessages: false });
  ch = ably.channels.get('relogio:' + canal);
  ably.connection.on(st => {
    diag('Ably: ' + st.current + (st.reason ? ' — ' + errTxt(st.reason) : ''));
    online = st.current === 'connected';
    showPill();
    if (online) refreshPresence();
  });
  ch.presence.subscribe(m => {
    if (m.clientId !== 'magico') return;
    if (m.action === 'leave' || m.action === 'absent') lose();
    else fromPresence(m.data, m.timestamp);
  });
  Promise.resolve(ch.subscribe('ok', msg => gotOk(msg.data || {}, msg.timestamp))).catch(e => diag('Ably assinar: ' + errTxt(e)));
  Promise.resolve(ch.subscribe('got', msg => gotGot(msg.data || {}, msg.timestamp))).catch(() => {});
  } catch (e) { diag('Ably erro: ' + errTxt(e)); }
}

// ===== envio =====
$('sendBtn').addEventListener('click', async () => {
  if (digits.length < 4) { flash('bad'); return; }
  const h = +digits.slice(0, 2), m = +digits.slice(2);
  if (h > 23 || m > 59) { flash('bad'); return; }
  if (!ch || !online) { flash('bad'); return; }
  const id = Math.random().toString(36).slice(2, 10);
  if (pending) { clearTimeout(pending.timer); clearTimeout(pending.gotTimer); }
  pending = { id };
  try { await ch.publish('hora', { h, m, id }); } catch (e) { diag('Ably enviar: ' + errTxt(e)); if (pending && pending.id === id) { pending = null; flash('bad'); } return; }
  if (!pending || pending.id !== id) return;
  // sem "chegou" em 5 s: o app do mágico não está lá -> Sem sinal
  pending.gotTimer = setTimeout(() => { if (pending && pending.id === id && !pending.got) { clearTimeout(pending.timer); pending = null; flash('bad'); lose(); } }, 5000);
  pending.timer = setTimeout(() => { if (pending && pending.id === id) { pending = null; flash('bad'); } }, 15000);
});
function gotGot(o, ts) {
  lastSeen = Math.max(lastSeen, ts || Date.now());
  if (pending && o.id === pending.id) { pending.got = true; clearTimeout(pending.gotTimer); }
}
function gotOk(o, ts) {
  lastSeen = Math.max(lastSeen, ts || Date.now()); lostAt = 0;
  linked = true; showPill();
  const mine = pending && o.id === pending.id;
  if (mine) { clearTimeout(pending.timer); clearTimeout(pending.gotTimer); pending = null; }
  if (o.ok) {
    setWatch(o.wt, o.y, true);
    if (mine) { flash('ok'); digits = ''; renderVisor(); }
  } else {
    setWatch(o.bt ? o.wt : null, o.y);
    if (mine) flash('bad');
  }
}

renderVisor();
showPill();
if (!canal) { $('nolink').classList.add('show'); }
else {
  start();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !ably) return;
    try { ably.connect(); } catch (e) {}
    refreshPresence();
  });
  window.addEventListener('online', () => { if (ably) try { ably.connect(); } catch (e) {} });
  $('pill').addEventListener('click', () => refreshPresence());
}
</script>
</body>
</html>
